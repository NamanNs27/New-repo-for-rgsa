name: Deploy Storage Account

on:
  push:
    branches:
      - deploy-storage-workflow

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          auth-type: SERVICE_PRINCIPAL

      - name: Deploy Bicep Template to Resource Group
        uses: azure/arm-deploy@v1
        with:
          subscriptionId: ${{ fromJSON(secrets.AZURE_CREDENTIALS).subscriptionId }}
          resourceGroupName: myRG
          template: ./main.bicep
          parameters: storageAccountName=namanuniquestorage123
          deploymentName: github-rg-deploy
          deploymentMode: Incremental